name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# CI never writes to the repository or receives deployment credentials.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  quality:
    name: TypeScript and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        # Still run tests when TypeScript reports an error, for complete diagnostics.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:ci

      - name: Preserve test report
        if: ${{ !cancelled() && hashFiles('reports/junit.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web production build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web application
        run: npm run build:web

      - name: Verify app-shell output
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/favicon.svg

      - name: Upload web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breathing-web-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  native:
    name: iOS and Android bundles
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Export both native platforms
        run: npm run build:native

      - name: Verify platform bundles
        run: |
          test -s dist-native/metadata.json
          test -n "$(find dist-native/_expo/static/js/ios -name '*.hbc' -print -quit)"
          test -n "$(find dist-native/_expo/static/js/android -name '*.hbc' -print -quit)"

      - name: Upload native bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breathing-native-bundles-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-native/
          if-no-files-found: error
          retention-days: 7
